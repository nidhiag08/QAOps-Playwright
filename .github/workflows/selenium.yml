name: Selenium Tests
# Manual only: this repo has no Maven project (pom.xml), so running on every push always failed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saucedemo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-report
          path: |
            saucedemo/reports/
            saucedemo/target/surefire-reports/
          retention-days: 14
