name: Playwright Tests
on:
  push:
    branches: [ main, master,septCut ]
  pull_request:
    branches: [ main, master ]
 
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
  #  container:
    #  image: mcr.microsoft.com/playwright:v1.49.0-noble
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
 
      - name: Run Playwright tests (shard)
        run: >
          npx playwright test --config=playwright.config.js --workers=4
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          --reporter=blob
 
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always() && inputs.update_snapshots
        with:
          name: snapshots-${{ matrix.shardIndex }}
          path: tests/**/*-snapshots/
          retention-days: 7

  test-result:
    name: test
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test.result }}" = "success" ]'

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
 
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
 
      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
 
      - name: Upload final HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
