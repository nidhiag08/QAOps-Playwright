name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate Linux screenshot baselines (download the "snapshots" artifact and commit it)'
        type: boolean
        default: false
# Tests share the same practice-site accounts (cart, bookings), so never run two at once — queue instead
concurrency:
  group: playwright-tests
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome firefox webkit
      - run: cp .env.example .env.qa
      - run: npx playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          ALL_BROWSERS: 1
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && inputs.update_snapshots
        with:
          name: snapshots
          path: tests/**/*-snapshots/
          retention-days: 7
