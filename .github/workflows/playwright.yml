name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The chromium project runs on the Google Chrome channel (channel: 'chrome'),
      # and ALL_BROWSERS=1 adds firefox and webkit
      - run: npx playwright install --with-deps chrome firefox webkit
      - run: cp .env.example .env.qa
      - run: npx playwright test
        env:
          ALL_BROWSERS: 1
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
